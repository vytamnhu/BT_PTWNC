<p>binding-two-way-component works!</p>
<table>
  <tr>
    <td colspan="4"><b>Phương Trình Bậc 2</b></td>
  </tr>
  <tr>
    <td>Hệ số a:</td>
    <td>
      <input type="number" [(ngModel)]="hsa" />
    </td>
    <td>Hệ số b:</td>
    <td>
      <input type="number" [(ngModel)]="hsb" />
    </td>
  </tr>
  <tr>
    <td>Hệ số c:</td>
    <td>
      <input type="number" [(ngModel)]="hsc" />
    </td>
  </tr>
  <tr>
    <td>Kết quả:</td>
    <td colspan="3">{{ ketQua }}</td>
  </tr>
  <tr>
    <td colspan="4">
      <button (click)="giaiPt2()">Giải</button>
      <button (click)="ptMoi()">PT Mới</button>
    </td>
  </tr>
</table>
