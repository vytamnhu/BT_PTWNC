<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>PRICE</th>
            <th>IMAGE</th> <!-- Đã thêm cột này -->
        </tr>
    </thead>
    <tbody>
        @for (p of products; track p.id){
        <tr>
            <td>{{p.id}}</td>
            <td>{{p.name}}</td>
            <td>{{p.price}}</td>
            <td><img [src]="p.image" [alt]="p.name" width="100" height="100"></td>
        </tr>
        }
        @empty{
            <tr>
                <td colspan="4">Not found Product!!!</td>
            </tr>
        }
    </tbody>
</table>
