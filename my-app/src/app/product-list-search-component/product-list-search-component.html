<p>product-list-search-component works!</p>
{{ errMessage() }}

<div style="margin-bottom: 15px;">
    <label>Giá Min: </label>
    <input type="number" [ngModel]="minPrice()" (ngModelChange)="minPrice.set($event)" />
    <br /><br />
    <label>Giá Max: </label>
    <input type="number" [ngModel]="maxPrice()" (ngModelChange)="maxPrice.set($event)" />
    <br /><br />
    <button (click)="onFilter()">Lọc sản phẩm</button>
</div>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Image</th>
            <th>Details</th>
            <th>Slug</th>
        </tr>
    </thead>
    <tbody>
        @for (p of filteredProducts(); track p.id) {
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td>
                <img [src]="p.image" [alt]="p.name" width="80" height="80" />
            </td>
            <td>
                <a (click)="viewDetail(p.id)" style="cursor: pointer;" title="click here to view detail">View detail</a>
            </td>
            <td>
                <a (click)="viewDetailSlug(p)" style="cursor: pointer;" title="click here to view detail">
                    {{ generateSlug(p.name, p.id) }}
                </a>
            </td>
        </tr>
        } @empty {
        <tr>
            <td colspan="6">No products available.</td>
        </tr>
        }
    </tbody>
</table>
